
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пользовательское соглашение — Meze</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #07152b;
      color: #f4f7ff;
      font-family: system-ui, Arial, sans-serif;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    a {
      color: #77c8ff;
      text-decoration: none;
    }

    h1 {
      font-size: clamp(28px, 5vw, 42px);
      margin: 32px 0 24px;
    }

    .notice {
      padding: 24px;
      background: #112543;
      border: 1px solid #284566;
      border-radius: 16px;
      line-height: 1.7;
    }

    p {
      color: #b1bfd5;
    }

    footer {
      margin-top: 48px;
      color: #8294ae;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <a href="../">← На главную</a>

    <h1>Пользовательское соглашение</h1>

    <div class="notice">
      <strong>Документ готовится</strong>

      <p>
        Пользовательское соглашение игры
        Meze: Лабиринты находится в разработке.
      </p>

      <p>
        Здесь будут опубликованы условия
        использования игры, правила получения
        игровых наград и информация о рекламе.
      </p>
    </div>

    <footer>Meze: Лабиринты</footer>
  </main>
</body>
</html>
